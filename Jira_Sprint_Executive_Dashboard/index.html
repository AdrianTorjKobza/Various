<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="date"] { color-scheme: dark; }
        ::-webkit-calendar-picker-indicator {
            filter: invert(58%) sepia(82%) saturate(432%) hue-rotate(185deg) brightness(101%) contrast(98%);
            cursor: pointer;
        }
        #dashboard-container {
            background-color: #020617;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div id="dashboard-container" class="max-w-6xl mx-auto space-y-8 p-4 rounded-3xl">
        
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-8">
                <div>
                    <h1 class="text-4xl font-black text-white tracking-tight">Sprint Dashboard</h1>
                    <div class="mt-4">
                        <button id="exportBtn" onclick="saveAsImage()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 px-5 rounded-xl flex items-center gap-2 transition-all shadow-lg active:scale-95">
                            💾 Export to Image
                        </button>
                    </div>
                </div>
                
                <div id="controls" class="flex flex-wrap gap-4 items-end">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-blue-400 mb-2 font-bold tracking-widest">Sprint Start</label>
                        <input type="date" id="sprintStartInput" class="bg-slate-800 border border-slate-600 rounded-xl py-2 px-4 text-white focus:ring-2 focus:ring-blue-500 w-full outline-none transition-all"/>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-blue-400 mb-2 font-bold tracking-widest">Sprint End</label>
                        <input type="date" id="sprintEndInput" class="bg-slate-800 border border-slate-600 rounded-xl py-2 px-4 text-white focus:ring-2 focus:ring-blue-500 w-full outline-none transition-all"/>
                    </div>
                    <div class="w-full md:w-auto">
                        <label class="block text-[10px] font-bold uppercase text-blue-400 mb-2">Upload CSV</label>
                        <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"/>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Sprint Scope</p>
                <div class="flex items-baseline gap-2">
                    <p id="totalTickets" class="text-4xl font-bold">0</p>
                    <span class="text-slate-500 text-sm font-medium">Tickets</span>
                </div>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Tickets Completed</p>
                <div class="flex items-baseline gap-2">
                    <p id="completedTickets" class="text-4xl font-bold text-emerald-400">0</p>
                    <span id="completionPercent" class="text-emerald-500/80 text-sm font-bold bg-emerald-500/10 px-2 py-0.5 rounded-md">0%</span>
                </div>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 text-amber-500">Working Days Left</p>
                <p id="daysLeft" class="text-4xl font-bold text-amber-500">--</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border-2 border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                <p class="text-sm text-blue-400 font-bold uppercase mb-1">Required Daily Velocity</p>
                <p id="reqVelocity" class="text-5xl font-black text-white">0</p>
                <p class="text-[10px] text-slate-500 mt-1 uppercase font-bold tracking-tighter italic">Tickets per working day</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
                <h3 class="text-lg font-bold mb-6 text-emerald-400 flex items-center gap-2">Tickets Status</h3>
                <div class="h-64"><canvas id="statusChart"></canvas></div>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
                <h3 class="text-lg font-bold mb-6 text-slate-300">Ticket Types</h3>
                <div class="h-64"><canvas id="typeChart"></canvas></div>
            </div>
        </div>

        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
            <h3 class="text-lg font-bold mb-6 text-slate-300">Tickets Distribution by Owner (A-Z)</h3>
            <div class="h-80"><canvas id="ownerChart"></canvas></div>
        </div>

        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-lg">
            <h3 class="text-lg font-bold mb-6 text-blue-400">Sprint Burndown</h3>
            <div class="h-80"><canvas id="burndownChart"></canvas></div>
        </div>
    </div>

    <script>
        Chart.register(ChartDataLabels);
        let charts = {};
        let activeData = [];

        const STATUS_ORDER = ["To Do", "In Progress", "Blocked", "Under Review", "Ready for Test", "Need Testing"];

        document.getElementById('csvFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    activeData = results.data;
                    refreshDashboard();
                }
            });
        });

        ['sprintStartInput', 'sprintEndInput'].forEach(id => {
            document.getElementById(id).addEventListener('change', refreshDashboard);
        });

        // HELPER: Calculates network days (Mon-Fri) inclusive of end date
        function getWorkingDaysLeft(startDate, endDate) {
            let count = 0;
            let curDate = new Date(startDate.getTime());
            curDate.setHours(0,0,0,0);
            
            const targetDate = new Date(endDate.getTime());
            targetDate.setHours(0,0,0,0);

            while (curDate <= targetDate) {
                const dayOfWeek = curDate.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { // 0 = Sunday, 6 = Saturday
                    count++;
                }
                curDate.setDate(curDate.getDate() + 1);
            }
            return count;
        }

        function refreshDashboard() {
            if (activeData.length === 0) return;
            const total = activeData.length;
            const completed = activeData.filter(d => ['Done', 'Closed', 'Resolved', 'Complete'].includes(d.Status)).length;
            const remaining = total - completed;
            
            const endVal = document.getElementById('sprintEndInput').value;
            let workingDaysLeft = 0;
            let velocity = 0;

            if (endVal) {
                const today = new Date();
                const endDate = new Date(endVal);
                
                // Calculate working days left (including today if today is a weekday)
                workingDaysLeft = getWorkingDaysLeft(today, endDate);
                
                velocity = workingDaysLeft > 0 ? (remaining / workingDaysLeft).toFixed(1) : remaining;
            }

            document.getElementById('totalTickets').innerText = total;
            document.getElementById('completedTickets').innerText = completed;
            document.getElementById('completionPercent').innerText = `${Math.round((completed/total)*100)}%`;
            document.getElementById('daysLeft').innerText = endVal ? workingDaysLeft : "--";
            document.getElementById('reqVelocity').innerText = velocity;

            renderAllCharts(activeData, total, completed);
        }

        // CHART RENDERING LOGIC (Remains identical to previous stable version)
        function renderAllCharts(data, total, completed) {
            const statusCounts = data.reduce((acc, r) => {
                const s = r['Status'] || 'Unknown';
                acc[s] = (acc[s] || 0) + 1;
                return acc;
            }, {});

            const finalStatusLabels = [...STATUS_ORDER];
            Object.keys(statusCounts).forEach(s => { if (!finalStatusLabels.includes(s)) finalStatusLabels.push(s); });
            const activeStatusLabels = finalStatusLabels.filter(label => statusCounts[label] > 0);
            const activeStatusValues = activeStatusLabels.map(label => statusCounts[label]);

            const ownerCounts = data.reduce((acc, r) => {
                const name = r['Assignee'] || 'Unassigned';
                acc[name] = (acc[name] || 0) + 1;
                return acc;
            }, {});

            const sortedOwnerLabels = Object.keys(ownerCounts).sort((a, b) => a.localeCompare(b));
            const sortedOwnerValues = sortedOwnerLabels.map(label => ownerCounts[label]);

            const typeCounts = data.reduce((acc, r) => {
                const t = r['Issue Type'] || 'Other';
                acc[t] = (acc[t] || 0) + 1;
                return acc;
            }, {});

            renderBar('statusChart', activeStatusLabels, activeStatusValues, '#10B981', 'y');
            renderDoughnut('typeChart', typeCounts);
            renderBar('ownerChart', sortedOwnerLabels, sortedOwnerValues, '#3B82F6', 'x');
            renderBurndown(total, completed);
        }

        function renderBar(id, labels, data, color, axis) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: color, borderRadius: 6 }] },
                options: {
                    indexAxis: axis, responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, datalabels: { color: '#fff', font: { weight: 'bold' }, anchor: 'end', align: 'start' } },
                    scales: { x: { grid: { display: false }, ticks: { color: '#94a3b8' } }, y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } } }
                }
            });
        }

        function renderDoughnut(id, dataMap) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'doughnut',
                data: { labels: Object.keys(dataMap), datasets: [{ data: Object.values(dataMap), backgroundColor: ['#3B82F6', '#8B5CF6', '#EC4899', '#F59E0B', '#10B981'], borderWeight: 0 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', usePointStyle: true } }, datalabels: { color: '#fff', font: { weight: 'bold' } } }
                }
            });
        }

        function renderBurndown(total, completed) {
            const id = 'burndownChart';
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'line',
                data: {
                    labels: ['Start', 'Current', 'End'],
                    datasets: [
                        { label: 'Ideal', data: [total, total/2, 0], borderColor: '#334155', borderDash: [5,5], pointRadius: 0 },
                        { label: 'Remaining', data: [total, total - completed, null], borderColor: '#3B82F6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.4, spanGaps: true }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, datalabels: { display: false } },
                    scales: { x: { grid: { display: false }, ticks: { color: '#94a3b8' } }, y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } } }
                }
            });
        }

        async function saveAsImage() {
            const element = document.getElementById('dashboard-container');
            const btn = document.getElementById('exportBtn');
            const controls = document.getElementById('controls');
            btn.style.visibility = 'hidden';
            controls.style.visibility = 'hidden';

            try {
                const canvas = await html2canvas(element, { backgroundColor: '#020617', scale: 2 });
                const link = document.createElement('a');
                link.download = `Sprint_Dashboard_${new Date().toISOString().split('T')[0]}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } finally {
                btn.style.visibility = 'visible';
                controls.style.visibility = 'visible';
            }
        }
    </script>
</body>
</html>
