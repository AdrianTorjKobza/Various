# Example server block for a dedicated host (e.g. a VM or container running nginx).
# Build with "npm run build" and copy dist/ to /var/www/overlap-cities.
# Keep the Content-Security-Policy identical to vercel.json.

server {
    listen 443 ssl;
    http2 on;
    server_name overlapcities.example.com;

    ssl_certificate     /etc/letsencrypt/live/overlapcities.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overlapcities.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/overlap-cities;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;   # static site: no uploads

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.open-meteo.com; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Note: no add_header inside these blocks – it would drop the security headers above.
    location /assets/ { limit_except GET HEAD { deny all; } expires 1y; try_files $uri =404; }
    location /data/   { limit_except GET HEAD { deny all; } expires 1h; try_files $uri =404; }
    location /        { limit_except GET HEAD { deny all; } try_files $uri /index.html; }
}

server {
    listen 80;
    server_name overlapcities.example.com;
    return 301 https://$host$request_uri;
}
